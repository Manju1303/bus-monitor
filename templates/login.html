<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Security Login - JKKM Bus Monitoring System</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#2563EB">
    <meta name="description" content="JKKM Educational Institutions - AI-Powered Bus Gate Entry & Exit Monitoring System">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JKKM Bus">
    <link rel="manifest" href="{{ url_for('serve_manifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo-box">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 6v6"/>
                        <path d="M16 6v6"/>
                        <path d="M2 12h20"/>
                        <path d="M4 18v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2"/>
                        <path d="M17 18v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2"/>
                        <rect width="20" height="14" x="2" y="4" rx="3"/>
                        <circle cx="6.5" cy="15.5" r="1"/>
                        <circle cx="17.5" cy="15.5" r="1"/>
                    </svg>
                </div>
                <h1 class="login-title">JKKM Bus Transit Monitor</h1>
                <p class="login-sub">JKKM Educational Institutions &bull; Security & Gate Access Portal</p>
            </div>

            {% if error %}
            <div class="flash-alert error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="input-field" placeholder="Operator username (admin)" required autofocus autocomplete="off">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="input-field" placeholder="Enter password (admin123)" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem 1rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    <span>Sign In to Dashboard</span>
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
